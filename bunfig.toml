# Defaults for bun:test coverage: the tests CLI's `--coverage-scope library`,
# mirrored from vitest.config.ts (the other scopes get a generated bunfig, see
# write_scoped_bunfig in scripts/_test-common.sh).
#
# The list scopes coverage to the library without its query runners:
#   * test/**          — test infrastructure and the test files
#                        themselves.
#   * src/queryRunners/* and the two error-mapper folders — driver code,
#     measured on their own by `--coverage-scope runners` / `mappers`
#     (src/utils/transactionIsolationLevel.ts too: only the runners use it).
[test]
# Force UTC before any test module loads (see test/lib/setupTimezone.ts).
preload = ["./test/lib/setupTimezone.ts"]
coveragePathIgnorePatterns = ["test/**", "src/queryRunners/*", "src/queryRunners/connectorErrorMappers/*", "src/queryRunners/databaseErrorMappers/*", "src/utils/transactionIsolationLevel.ts"]
