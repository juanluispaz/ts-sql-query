on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'What to publish'
        type: choice
        required: true
        default: alpha
        options:
          - alpha       # v2 (master): publish with dist-tag `alpha`
          - beta        # v2 (master): publish with dist-tag `beta`
          - latest      # v2 (master): publish with dist-tag `latest` (stable versions only)
          - v1          # legacy 1.x line, published from the `v1` branch
      dry_run:
        # `npm stage publish --dry-run` — build + validate the publish, stage
        # nothing. A modifier on the chosen release_type, not a separate tag:
        # npm REQUIRES an explicit --tag to publish a prerelease version (e.g.
        # 2.0.0-alpha.3), so a tagless dry-run would error. Dry-running `latest`
        # while the version is a prerelease still (correctly) fails.
        description: 'Dry run (stage nothing)'
        type: boolean
        required: true
        default: true

name: Publish

# npm Trusted Publishing (OIDC): npm registers THIS file (release.yml) as the
# single trusted publisher for `ts-sql-query`, so every publish path lives here.
# `id-token: write` lets the runner mint the OIDC token npm exchanges for a
# short-lived publish credential — no NODE_AUTH_TOKEN. Provenance is generated
# automatically when publishing this way from a public repo.
#
# The jobs run `npm stage publish` (staged publishing): CI uploads the version
# to a STAGING area unattended (no 2FA), where it is NOT yet installable. A
# maintainer then promotes it to the live registry with `npm stage approve
# <stage-id>` (or the Approve button on npmjs.com), which prompts for 2FA. Enable
# the "npm stage publish" action in the trusted-publisher config for this to work.
permissions:
  contents: read
  id-token: write

jobs:
  # ── v2 line (master) ───────────────────────────────────────────────────────
  # Full test suite on BOTH runtimes, in parallel: Bun (`bun test`) and
  # Node/vitest. Both gate the v2 publish via `needs: [bun, node]`. The
  # Node/vitest run was dropped in the past because vitest took ~25 min, but with
  # `isolate: false` in vitest.config.ts it is fast again (see
  # test/BENCHMARKS.md), so it is back as an independent gate — the artifact
  # publishes from Node, so validating the Node/vitest path before publishing is
  # worthwhile.
  bun:
    if: inputs.release_type != 'v1'
    name: bun validation
    runs-on: ubuntu-latest

    steps:
      # Setup environment
      - uses: actions/checkout@v6

      # Validate branch
      - name: Validate if in master branch
        run: '[ "$GITHUB_REF_NAME" == "master" ] || { echo "Not in master: $GITHUB_REF_NAME"; exit 1; }'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Build
      - name: Prepare
        run: bun run codegen
      - name: Bun build (tsc)
        run: bun run validate
      # Same src check with tsgo (preview TS 7 compiler).
      - name: Bun build (tsgo)
        run: bun run validate:tsgo

      # Type-check the test/ tree against the published library types.
      # tsgo is authoritative for the test matrix — it's the test-scope
      # gate the release runs. (Tests don't ship, so there's no downstream
      # tsc-compat obligation; src's tsc-compat is covered by the `Bun build
      # (tsc)` step above.) `validate:tests` splits one tsgo program per
      # connector so each slice fits the 16 GB runner.
      - name: Bun validate tests (tsgo, authoritative)
        run: bun run validate:tests

      # Symmetry audit (DESIGN §4) — structural check of test/db/.
      - name: Bun audit test symmetry
        run: bun run tests:audit

      # Light tests (docker tests not supported yet)
      - name: Bun light tests
        run: bun run no-docker-examples

      # New test suite — full matrix mocked + real WASM (no docker), split into
      # 4 memory-bounded shards (same partition as ci.yml / the node job above).
      # Separate steps so each shard has its own readable log.
      - name: Bun new test suite — shard 1 (wasm, real)
        run: bun run test:no-docker:shard 1
      - name: Bun new test suite — shard 2 (sqlite-A)
        run: bun run test:no-docker:shard 2
      - name: Bun new test suite — shard 3 (sqlite-B)
        run: bun run test:no-docker:shard 3
      - name: Bun new test suite — shard 4 (rest)
        run: bun run test:no-docker:shard 4

  # Node/vitest counterpart of the bun job above — runs in parallel (no `needs`,
  # so GitHub schedules them concurrently). Same suite, but the test matrix runs
  # under vitest (`isolate: false`, fast again) and the legacy examples under
  # tsx/node, so both runtimes' execution paths are validated before publishing.
  # Mirrors the `build` job in ci.yml (single Node version instead of the 22/24/26
  # matrix). The test scope is gated with tsgo only (`validate:tests`).
  node:
    if: inputs.release_type != 'v1'
    name: node validation
    runs-on: ubuntu-latest

    steps:
      # Setup environment
      - uses: actions/checkout@v6

      # Validate branch
      - name: Validate if in master branch
        run: '[ "$GITHUB_REF_NAME" == "master" ] || { echo "Not in master: $GITHUB_REF_NAME"; exit 1; }'

      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build
      - name: Prepare
        run: npm run codegen
      - name: Build
        run: npm run build
      # Type-check src with tsgo (preview TS 7 compiler) in addition to the tsc
      # check covered by `npm run build` above.
      - name: Validate src (tsgo)
        run: npm run validate:tsgo

      # Type-check the test/ tree against the published library types (tsgo,
      # authoritative — same gate as the bun job and ci.yml).
      - name: Validate tests (tsgo, authoritative)
        run: npm run validate:tests

      # Symmetry audit (DESIGN §4) — structural check of test/db/.
      - name: Audit test symmetry
        run: npm run tests:audit

      # Light tests (docker tests not supported yet) — legacy examples under tsx/node.
      - name: Light tests
        run: npm run no-docker-examples

      # New test suite — full matrix mocked + real WASM (no docker), under vitest,
      # split into 4 memory-bounded shards. Run as one process the matrix peaks
      # ~15.9 GB and OOMs the 16 GB runner on Node 26 (this job) at the final
      # aggregation; each shard is a separate runner invocation so memory frees
      # between them. Same partition as ci.yml — see the comment there. Separate
      # steps so each shard has its own readable log.
      - name: New test suite (vitest) — shard 1 (wasm, real)
        run: npm run test:no-docker:shard -- 1
      - name: New test suite (vitest) — shard 2 (sqlite-A)
        run: npm run test:no-docker:shard -- 2
      - name: New test suite (vitest) — shard 3 (sqlite-B)
        run: npm run test:no-docker:shard -- 3
      - name: New test suite (vitest) — shard 4 (rest)
        run: npm run test:no-docker:shard -- 4

  publish:
    if: inputs.release_type != 'v1'
    needs: [bun, node]
    name: build & publish (v2)
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      # Setup environment
      - uses: actions/checkout@v6
      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing (`npm stage publish`) needs npm >= 11.15.0; the npm
      # bundled with Node 26 is older, so upgrade it within the 11.x line.
      - name: Update npm (staged publishing needs >= 11.15.0)
        run: npm install -g npm@^11.15.0

      # Validate branch
      - name: Validate if in master branch
        run: '[ "$GITHUB_REF_NAME" == "master" ] || { echo "Not in master: $GITHUB_REF_NAME"; exit 1; }'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build
      - name: Prepare
        run: npm run codegen
      - name: Build
        run: npm run build
      # Type-check src with tsgo (preview TS 7 compiler) in addition to
      # the tsc check already covered by `npm run build` above.
      - name: Validate src (tsgo)
        run: npm run validate:tsgo

      # Tests (new matrix + legacy examples) and the test-tree typecheck run on
      # the `bun` and `node` jobs above (in parallel); `needs: [bun, node]` gates
      # this job on both being green, so this Node step only builds the
      # publishable artifact and publishes it.

      # Stage-publish via OIDC trusted publishing — no NODE_AUTH_TOKEN. Each
      # `dist*` script runs `npm stage publish`, so the version lands in the
      # staging area pending a maintainer's `npm stage approve`. The dist-tag is
      # selected by release_type; dry_run appends `--dry-run` (passed through to
      # the script's final `npm stage publish` via `npm run … -- --dry-run`).
      - name: Build for dist & Publish
        run: |
          dry=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then dry="-- --dry-run"; fi
          case "${{ inputs.release_type }}" in
            latest)  npm run dist $dry ;;
            alpha)   npm run dist-alpha $dry ;;
            beta)    npm run dist-beta $dry ;;
            *) echo "Unexpected release_type: ${{ inputs.release_type }}"; exit 1 ;;
          esac

  # ── v1 line (legacy) ───────────────────────────────────────────────────────
  # Published from the `v1` branch with that branch's own scripts. The workflow
  # file still lives on master, so the OIDC claims (workflow=release.yml,
  # environment=npm-release) match the trusted-publisher config; only the
  # checked-out code is v1. Keeps its own Node-based light tests (the v1 line
  # predates the Bun test matrix).
  publish-v1:
    if: inputs.release_type == 'v1'
    name: build & publish (v1 legacy)
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      # Setup environment
      - uses: actions/checkout@v6
        with:
          ref: v1

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing (`npm stage publish`) needs npm >= 11.15.0; Node 22
      # ships npm 10.x, so upgrade it within the 11.x line.
      - name: Update npm (staged publishing needs >= 11.15.0)
        run: npm install -g npm@^11.15.0

      # Show package.json
      - name: Show package.json
        run: 'cat package.json'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build
      - name: Prepare
        run: npm run generate-prisma
      - name: Build
        run: npm run build

      # Light tests (docker tests not supported yet)
      - name: Light tests
        run: npm run no-docker-examples

      # Runs the v1 branch's own `dist` script via OIDC (no NODE_AUTH_TOKEN).
      # The v1 branch's `dist` already uses `npm stage publish`; dry_run appends
      # `--dry-run` the same way as the v2 path.
      - name: Build for dist & Publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dist -- --dry-run
          else
            npm run dist
          fi
