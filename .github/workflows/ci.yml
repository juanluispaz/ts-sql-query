on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

name: CI

jobs:
  build:
    name: node validation
    runs-on: ubuntu-latest
    strategy:
        matrix:
            node-version: [22.x, 24.x, 26.x]
    steps:
      # Setup environment
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build
      - name: Prepare
        run: npm run codegen
      - name: Build
        run: npm run build

      # Type-check src with tsgo (preview TS 7 compiler) in addition to
      # the tsc check already covered by `npm run build` above.
      - name: Validate src (tsgo)
        run: npm run validate:tsgo

      # Type-check the test/ tree against the published library types.
      # tsgo is authoritative for the test matrix and is the only
      # test-scope type-check CI gates on. The stable-tsc cross-check
      # (`validate:tests:tsc`) stays a local-only sub-experience: tests
      # don't ship, so there's no downstream tsc-compat obligation, and
      # checking the whole matrix + src in a single tsc program now
      # exhausts V8's heap. src's tsc-compat obligation is still covered
      # by the `Build` / `validate` steps above.
      - name: Validate tests (tsgo, authoritative)
        run: npm run validate:tests

      # Symmetry audit (DESIGN §4) — structural check of test/db/.
      - name: Audit test symmetry
        run: npm run tests:audit

      # Light tests (docker tests not supported yet)
      - name: Light tests
        run: npm run no-docker-examples

      # New test suite — full matrix mocked + real WASM phase (no docker).
      - name: New test suite
        run: npm run test:no-docker

  bun:
    name: bun validation
    runs-on: ubuntu-latest
    steps:
      # Setup environment
      - uses: actions/checkout@v6
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Prepare generated clients used by examples
      - name: Prepare
        run: bun run codegen

      # Build check without emitting dist (tsc).
      - name: Bun build (tsc)
        run: bun run validate
      # Same src check with tsgo (preview TS 7 compiler).
      - name: Bun build (tsgo)
        run: bun run validate:tsgo

      # Type-check the test/ tree against the published library types.
      # tsgo is authoritative for the test matrix and is the only
      # test-scope type-check CI gates on. The stable-tsc cross-check
      # (`validate:tests:tsc`) stays a local-only sub-experience: tests
      # don't ship, so there's no downstream tsc-compat obligation, and
      # checking the whole matrix + src in a single tsc program now
      # exhausts V8's heap. src's tsc-compat obligation is still covered
      # by the `Bun build (tsc)` / `validate` step above.
      - name: Bun validate tests (tsgo, authoritative)
        run: bun run validate:tests

      # Symmetry audit (DESIGN §4) — structural check of test/db/.
      - name: Bun audit test symmetry
        run: bun run tests:audit

      # Light tests (docker tests not supported yet)
      - name: Bun light tests
        run: bun run no-docker-examples

      # New test suite — full matrix mocked + real WASM phase (no docker).
      - name: Bun new test suite
        run: bun run test:no-docker
