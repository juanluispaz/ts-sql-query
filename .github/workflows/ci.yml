on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

name: CI

jobs:
  build:
    name: node validation
    runs-on: ubuntu-latest
    strategy:
        matrix:
            node-version: [22.x, 24.x, 26.x]
    steps:
      # Setup environment
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build
      - name: Prepare
        run: npm run codegen
      - name: Build
        run: npm run build

      # Type-check src with tsgo (preview TS 7 compiler) in addition to
      # the tsc check already covered by `npm run build` above.
      - name: Validate src (tsgo)
        run: npm run validate:tsgo

      # Type-check the test/ tree against the published library types.
      # tsgo is authoritative for the test matrix — it's the test-scope
      # gate. (Tests don't ship, so there's no downstream tsc-compat
      # obligation; src's tsc-compat is covered by the `Build` / `validate`
      # steps above.) `validate:tests` splits one tsgo program per connector
      # so each slice fits the 16 GB runner (a single whole-matrix program
      # OOMs past ~17 GB).
      - name: Validate tests (tsgo, authoritative)
        run: npm run validate:tests

      # Symmetry audit (DESIGN §4) — structural check of test/db/.
      - name: Audit test symmetry
        run: npm run tests:audit

      # Light tests (docker tests not supported yet)
      - name: Light tests
        run: npm run no-docker-examples

      # New test suite — full matrix mocked + real WASM (no docker), split
      # into 4 memory-bounded shards. Run as one process the matrix peaks
      # ~15.9 GB and OOMs the 16 GB runner on Node 26 at the final aggregation;
      # each shard is a separate runner invocation so the memory is freed
      # between them (peak = the biggest shard, ~8 GB). Every test file runs in
      # exactly one shard. Shard 1 (wasm) runs the WASM cells real+sequential;
      # shards 2-4 run parallel with WASM mocked. Separate steps so each shard
      # has its own readable log. See `scripts/tests.sh --help` (Sharding).
      - name: New test suite — shard 1 (wasm, real)
        run: npm run test:no-docker:shard -- 1
      - name: New test suite — shard 2 (sqlite-A)
        run: npm run test:no-docker:shard -- 2
      - name: New test suite — shard 3 (sqlite-B)
        run: npm run test:no-docker:shard -- 3
      - name: New test suite — shard 4 (rest)
        run: npm run test:no-docker:shard -- 4

  bun:
    name: bun validation
    runs-on: ubuntu-latest
    steps:
      # Setup environment
      - uses: actions/checkout@v6
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Prepare generated clients used by examples
      - name: Prepare
        run: bun run codegen

      # Build check without emitting dist (tsc).
      - name: Bun build (tsc)
        run: bun run validate
      # Same src check with tsgo (preview TS 7 compiler).
      - name: Bun build (tsgo)
        run: bun run validate:tsgo

      # Type-check the test/ tree against the published library types.
      # tsgo is authoritative for the test matrix — it's the test-scope
      # gate. (Tests don't ship, so there's no downstream tsc-compat
      # obligation; src's tsc-compat is covered by the `Bun build (tsc)` /
      # `validate` step above.) `validate:tests` splits one tsgo program per
      # connector so each slice fits the 16 GB runner (a single whole-matrix
      # program OOMs past ~17 GB).
      - name: Bun validate tests (tsgo, authoritative)
        run: bun run validate:tests

      # Symmetry audit (DESIGN §4) — structural check of test/db/.
      - name: Bun audit test symmetry
        run: bun run tests:audit

      # Light tests (docker tests not supported yet)
      - name: Bun light tests
        run: bun run no-docker-examples

      # New test suite — full matrix mocked + real WASM (no docker), split
      # into 4 memory-bounded shards (same partition as the node job; see the
      # comment there). Separate steps so each shard has its own readable log.
      - name: Bun new test suite — shard 1 (wasm, real)
        run: bun run test:no-docker:shard 1
      - name: Bun new test suite — shard 2 (sqlite-A)
        run: bun run test:no-docker:shard 2
      - name: Bun new test suite — shard 3 (sqlite-B)
        run: bun run test:no-docker:shard 3
      - name: Bun new test suite — shard 4 (rest)
        run: bun run test:no-docker:shard 4
